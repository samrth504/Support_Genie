# Alembic = version control for the database schema.
# Commands (run from the backend/ folder):
#   alembic revision --autogenerate -m "describe change"   # create a migration from model changes
#   alembic upgrade head                                    # apply migrations to the database
#   alembic downgrade -1                                    # undo the last migration

[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL is NOT stored here; alembic/env.py reads it from app settings (.env)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
